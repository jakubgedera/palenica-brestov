<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zväčšená fotografia">
  <button class="lightbox-close" type="button" aria-label="Zavrieť">&times;</button>
  <button class="lightbox-btn lightbox-prev" type="button" aria-label="Predchádzajúca fotografia">&#8249;</button>
  <figure class="lightbox-figure">
    <img id="lightbox-img" src="" alt="">
    <figcaption class="lightbox-counter" id="lightbox-counter"></figcaption>
  </figure>
  <button class="lightbox-btn lightbox-next" type="button" aria-label="Ďalšia fotografia">&#8250;</button>

<script>
(function () {
  var links = Array.prototype.slice.call(
    document.querySelectorAll('.gallery-grid a')
  );
  if (!links.length) return;

  var lightbox = document.getElementById('lightbox');
  var img = document.getElementById('lightbox-img');
  var counter = document.getElementById('lightbox-counter');
  var btnClose = lightbox.querySelector('.lightbox-close');
  var btnPrev = lightbox.querySelector('.lightbox-prev');
  var btnNext = lightbox.querySelector('.lightbox-next');
  var current = 0;
  var lastFocused = null;

  function show(index) {
    current = (index + links.length) % links.length;
    var link = links[current];
    img.src = link.getAttribute('href');
    img.alt = link.querySelector('img').alt || '';
    counter.textContent = (current + 1) + ' / ' + links.length;
  }

  function open(index) {
    lastFocused = document.activeElement;
    show(index);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
    btnNext.focus();
  }

  function close() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    img.src = '';
    if (lastFocused) lastFocused.focus();
  }

  links.forEach(function (link, i) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      open(i);
    });
  });

  btnPrev.addEventListener('click', function () { show(current - 1); });
  btnNext.addEventListener('click', function () { show(current + 1); });
  btnClose.addEventListener('click', close);

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) close();
  });

  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
  });

  // Swipe na dotykových zariadeniach
  var touchX = null;
  lightbox.addEventListener('touchstart', function (e) {
    touchX = e.changedTouches[0].clientX;
  }, { passive: true });
  lightbox.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var diff = e.changedTouches[0].clientX - touchX;
    if (Math.abs(diff) > 50) show(current + (diff < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });
})();
</script>
